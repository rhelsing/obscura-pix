name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR / branch so a force-push doesn't
# pile up runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  domain-tests:
    name: Domain tests (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Domain, bridge-facade, and state tests run without a native simulator.
      - run: npm test

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # ESLint errors fail the job; warnings remain non-fatal.
      - run: npm run lint

  android:
    name: Android Release Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pix
        uses: actions/checkout@v7
        with:
          # Native is pinned by Pix's gitlink and contains the transport proto
          # submodule required by Kotlin protobuf codegen.
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.3.0

      - run: npm ci

      # The Firebase Gradle plugin requires a google-services.json or the
      # build fails. The real file is per-environment + gitignored, so we
      # write a CI-only stub that has the right shape but a fake project.
      # FCM doesn't actually fire from CI builds, so a fake project is fine.
      - name: Write stub google-services.json
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-stub",
              "storage_bucket": "ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.obscuraapp.android" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSy0000000000000000000000000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: android

  ios:
    name: iOS Debug Build
    runs-on: macos-26
    env:
      LIBSIGNAL_VERSION: v0.40.0
    steps:
      - name: Checkout Pix and native dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(
            find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' -print |
              sort -V |
              tail -n 1
          )"

      - name: Cache libsignal source and simulator FFI
        id: libsignal
        uses: actions/cache@v6
        with:
          path: obscura-native/swift/vendored/libsignal
          key: libsignal-${{ env.LIBSIGNAL_VERSION }}-ios-sim-macos26

      - name: Fetch and build libsignal FFI
        if: steps.libsignal.outputs.cache-hit != 'true'
        working-directory: obscura-native/swift
        run: |
          brew list protobuf >/dev/null 2>&1 || brew install protobuf
          mkdir -p vendored
          for attempt in 1 2 3; do
            echo "libsignal clone attempt $attempt"
            git clone --depth 1 --branch "$LIBSIGNAL_VERSION" \
              https://github.com/signalapp/libsignal vendored/libsignal && break
            rm -rf vendored/libsignal
            sleep 15
          done
          test -f vendored/libsignal/Package.swift
          (
            cd vendored/libsignal
            RUSTUP_TOOLCHAIN=stable \
              CARGO_BUILD_TARGET=aarch64-apple-ios-sim \
              BINDGEN_EXTRA_CLANG_ARGS="--target=arm64-apple-ios16.0-simulator" \
              ./swift/build_ffi.sh -r
          )

      - name: Prepare Swift package
        working-directory: obscura-native/swift
        run: ./dev.sh prepare

      - run: npm ci

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 -N

      - name: Resolve iOS pods
        working-directory: ios
        run: pod install

      - name: Build iOS app
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.bareRepository
          GIT_CONFIG_VALUE_0: all
        run: |
          xcodebuild \
            -workspace ios/ObscuraApp.xcworkspace \
            -scheme ObscuraApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
