name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR / branch so a force-push doesn't
# pile up runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  domain-tests:
    name: Domain tests (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge vectors are read from obscura-proto at proto/conformance/merge.json.
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Pure-logic suite (src/domain): no React Native, no simulator, ~1s. This is the safety net
      # for the logic being moved out of the kits — see obscura-proto/KIT_API.md §8.2.
      - run: npm test

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # `eslint .` fails on errors but not warnings — this PR establishes the
      # gate, a follow-up cleans up the ~17 pre-existing warnings before we
      # tighten to `--max-warnings 0`. Tracking that as a separate todo so
      # this PR stays small.
      - run: npm run lint

  android:
    name: Android Release Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pix
        uses: actions/checkout@v7

      # The pix Android build consumes the kit via a Gradle composite build
      # (settings.gradle includeBuild), NOT a published artifact. We check
      # the kit out next to the pix build so `includeBuild` can find it and
      # substitute com.obscura:obscura-kit -> the local :lib project, built
      # from source. This keeps pix CI's green coupled to ObscuraKit-Kotlin's
      # main being green — and, crucially, catches cross-repo toolchain drift
      # (e.g. a kit Kotlin bump past pix's React-Native-pinned Kotlin) as a
      # red build instead of a latent runtime surprise.
      # ⚠️ Floating on the kit's default branch is deliberate (see above) — and it MUST be
      # pinned to a ref for the duration of obscura-proto PLAN.md Phase 3. That phase deletes
      # the kit's ORM in a step BEFORE pix switches to the replacement API (KIT_API.md §10),
      # so a float turns "the kit landed its deletion" into "pix CI is red" for every commit
      # in between, on a repo that cannot fix it yet. Add `ref: <sha>` here when Phase 3 step 2
      # starts; remove it after step 4 lands and pix is on the new API.
      #
      # Note also there is NO iOS job in this workflow. §10's ordering argument — "Kotlin ships
      # first would break iOS for the whole duration" — is therefore invisible to CI: nothing
      # here would go red if the Swift kit and pix's shared TypeScript surface diverged.
      - name: Checkout ObscuraKit-Kotlin
        uses: actions/checkout@v7
        with:
          repository: rhelsing/ObscuraKit-Kotlin
          path: ObscuraKit-Kotlin
          # The kit generates protobuf code from its ./proto submodule; without
          # this the composite build fails codegen (Unresolved reference on
          # generated proto types).
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      # The Firebase Gradle plugin requires a google-services.json or the
      # build fails. The real file is per-environment + gitignored, so we
      # write a CI-only stub that has the right shape but a fake project.
      # FCM doesn't actually fire from CI builds, so a fake project is fine.
      - name: Write stub google-services.json
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-stub",
              "storage_bucket": "ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.obscuraapp.android" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSy0000000000000000000000000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: android
        env:
          # The kit is checked out at $GITHUB_WORKSPACE/ObscuraKit-Kotlin;
          # this gradle build runs from android/, so the kit sits at
          # ../ObscuraKit-Kotlin. Locally the default in settings.gradle
          # (../../ObscuraKit-Kotlin, kit as a sibling of obscura-pix) applies.
          OBSCURA_KIT_PATH: ../ObscuraKit-Kotlin
