name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR / branch so a force-push doesn't
# pile up runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: just install
      # Domain, bridge-facade, and state tests run without a native simulator.
      # ESLint errors fail the job; warnings remain non-fatal.
      - run: just check

  android:
    name: Android + push sender
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pix
        uses: actions/checkout@v7
        with:
          # Native is pinned by Pix's gitlink and contains the transport proto
          # submodule required by Kotlin protobuf codegen.
          submodules: recursive

      - uses: extractions/setup-just@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.3.0

      - run: just install

      # Distribution has its own signed, minified post-CI workflow. Keep this
      # secret-free job as the fast compile gate on both pull requests and main.
      - name: Compile arm64 release APK
        run: just android-release arm64-v8a false

      # Reuses the composite-built native kit outputs from the app build.
      - name: Build push sender
        run: just push-sender-build

  ios:
    name: iOS Debug Build
    runs-on: macos-26
    env:
      LIBSIGNAL_REF: 7ef4efdb85d8b2ebd77f3cf1e2b542a2115033c5
    steps:
      - name: Checkout Pix and native dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: extractions/setup-just@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(
            find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' -print |
              sort -V |
              tail -n 1
          )"

      - name: Cache libsignal source and simulator FFI
        id: libsignal
        uses: actions/cache@v6
        with:
          path: obscura-native/swift/vendored/libsignal
          key: libsignal-${{ env.LIBSIGNAL_REF }}-ios-sim-macos26

      - name: Install protobuf
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf

      - run: just install

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 -N

      - name: Build arm64 iOS app
        if: github.event_name == 'pull_request'
        run: just ios-build arm64

      - name: Build full iOS app
        if: github.event_name == 'push'
        run: just ios-build
