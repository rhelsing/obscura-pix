version: 2
updates:

  # ─── npm ────────────────────────────────────────────────
  # JS deps in package.json. Grouped where versions are coupled to avoid
  # noisy "bump one of N peer-pinned packages" PRs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # The @react-native/* preset packages are version-locked to the
      # react-native major.minor. Bumping them one at a time means one
      # passing build per package; bumping together is the right shape.
      react-native:
        patterns:
          - "react-native"
          - "@react-native/*"
          - "@react-native-community/*"
      react-navigation:
        patterns:
          - "@react-navigation/*"
      react:
        patterns:
          - "react"
          - "@types/react*"
    ignore:
      # React Native is still 0.x, so minor releases are breaking toolchain
      # migrations (AGP, Gradle, Kotlin, native APIs). Keep the core package
      # and its version-locked presets on the current minor; patches can
      # still flow automatically.
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "@react-native/*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # CLI majors are coordinated with React Native minor upgrades.
      - dependency-name: "@react-native-community/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      # v9 requires Android API 37 / AGP 9, while RN 0.86 owns the API 36 /
      # AGP 8.12 toolchain. Move this with the next RN toolchain migration.
      - dependency-name: "react-native-pager-view"
        update-types: ["version-update:semver-major"]
      # vision-camera v5 is a nitro-modules rewrite — adds 2 native deps,
      # completely different API. Deliberately held at v4.x.
      - dependency-name: "react-native-vision-camera"
        update-types: ["version-update:semver-major"]
      # Peer-pinned by @react-native/* presets — can't move ahead of RN.
      # Minors/patches still fine (rare, but possible).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/runtime"
        update-types: ["version-update:semver-major"]
      # Allow TypeScript majors to open PRs so CI exposes compatibility work.

  # ─── Android gradle (pix app) ───────────────────────────
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      firebase:
        patterns:
          - "com.google.firebase:*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx:*"
      androidx-lifecycle:
        patterns:
          - "androidx.lifecycle:*"
    ignore:
      # Owned by obscura-native/kotlin — bumps must happen there first so the
      # package re-publishes against the new version, then pix follows.
      # Verified: bumping sqldelight in pix alone breaks compileReleaseKotlin
      # because the kit jar references the older API surface.
      - dependency-name: "org.signal:libsignal-android"
      - dependency-name: "com.google.protobuf:protobuf-java"
      - dependency-name: "app.cash.sqldelight:*"
      # Bumped via the kit's own publication. Dependabot can't see
      # mavenLocal anyway.
      - dependency-name: "dev.barrelmaker.obscura.kit:obscura-kit"
      # RN owns the AGP/toolchain compatibility line. Wrapper updates are
      # made manually and validated with the app and native composite build.
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "gradle"
      - dependency-name: "gradle-wrapper"

  # ─── Android gradle (push-sender dev tool) ──────────────
  # This standalone dev tool composite-builds obscura-native/kotlin (:lib),
  # so its toolchain is pinned to the kit's line (Kotlin 2.1.20, Gradle
  # 8.14.x, coroutines 1.8.x). Left ungated, Dependabot floats it onto its
  # own Kotlin/Gradle major (it reached Kotlin 2.4 / Gradle 9.7), which
  # diverges from the kit it builds and adds a second Gradle dist to the
  # cache. Keep it in sync with obscura-native/kotlin instead.
  - package-ecosystem: "gradle"
    directory: "/tools/push-sender"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx:*"
    ignore:
      # Pinned to the kit's Kotlin (2.1.20). Same reason as
      # obscura-native/kotlin: a newer Kotlin compiler diverges from the
      # composite-built :lib. Bump in lockstep with the kit.
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlin.*"
      # Coroutines releases are Kotlin-compiler-sensitive and newer versions
      # have failed against the pinned 2.1.20. Move with the Kotlin bump.
      - dependency-name: "org.jetbrains.kotlinx:*"
      # Keep the wrapper exactly aligned with the kit and app. Dependabot
      # cannot coordinate the three builds, so all bumps happen by hand.
      - dependency-name: "gradle"
      - dependency-name: "gradle-wrapper"
      # Published by the kit; bumped via its own publication, not here.
      - dependency-name: "dev.barrelmaker.obscura.kit:obscura-kit"

  # ─── GitHub Actions ─────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
