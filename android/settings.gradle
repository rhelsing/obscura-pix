pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'ObscuraPix'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// ── obscura-native Kotlin composite build ───────────────────────────
// Pix pins the native repo as a submodule. Rather than publish it to a
// registry, we compose its Gradle build directly.
//
// `implementation("dev.barrelmaker.obscura.kit:obscura-kit:0.1.0")` in app/build.gradle
// stays as-is — the explicit substitution below rewrites it to the local
// :lib project. The declared 0.1.0 is ignored while composed; it only
// matters if/when we graduate the kit to a real published artifact.
//
// OBSCURA_KIT_PATH can point at another checkout while developing coordinated
// native changes; committed and CI builds use the pinned submodule.
def obscuraKitPath = System.getenv('OBSCURA_KIT_PATH') ?: '../obscura-native/kotlin'
includeBuild(obscuraKitPath) {
    dependencySubstitution {
        substitute(module('dev.barrelmaker.obscura.kit:obscura-kit')).using(project(':lib'))
    }
}
