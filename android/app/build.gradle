apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

// Release signing — credentials live in android/keystore.properties (gitignored).
// If the file is absent (fresh clone / CI without secrets), release falls back to debug
// signing so the project still builds.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def signingValue = { String propertyName, String environmentName ->
    System.getenv(environmentName) ?: keystoreProperties[propertyName]
}
def releaseStoreFilePath = signingValue("storeFile", "ANDROID_RELEASE_STORE_FILE")
def releaseStorePassword = signingValue("storePassword", "ANDROID_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = signingValue("keyAlias", "ANDROID_RELEASE_KEY_ALIAS")
def releaseKeyPassword = signingValue("keyPassword", "ANDROID_RELEASE_KEY_PASSWORD")
def releaseStoreFile = releaseStoreFilePath ? file(releaseStoreFilePath) : null
def releaseSigningConfigured =
    releaseStoreFile?.isFile() &&
    releaseStorePassword &&
    releaseKeyAlias &&
    releaseKeyPassword

def distributionBuild =
    (findProperty("obscuraDistributionBuild") ?: "false").toBoolean()
def obscuraVersionCode =
    (findProperty("obscuraVersionCode") ?: "1").toString().toInteger()
def obscuraVersionName =
    (findProperty("obscuraVersionName") ?: "1.0").toString()

if (obscuraVersionCode <= 0) {
    throw new GradleException("obscuraVersionCode must be a positive integer")
}
if (obscuraVersionName.trim().isEmpty()) {
    throw new GradleException("obscuraVersionName must not be empty")
}
if (distributionBuild) {
    if (!releaseSigningConfigured) {
        throw new GradleException(
            "Distribution builds require a readable release keystore and all signing credentials"
        )
    }
    if (!hasProperty("obscuraVersionCode") || !hasProperty("obscuraVersionName")) {
        throw new GradleException(
            "Distribution builds require obscuraVersionCode and obscuraVersionName"
        )
    }

    def firebaseConfig = file("google-services.json")
    def firebaseStub = file("google-services.stub.json")
    if (!firebaseConfig.isFile()) {
        throw new GradleException("Distribution builds require android/app/google-services.json")
    }
    if (firebaseStub.isFile() && firebaseConfig.bytes == firebaseStub.bytes) {
        throw new GradleException(
            "Distribution builds require the real Firebase config, not google-services.stub.json"
        )
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

// R8 + resource shrinking are on for release. Keep rules live in proguard-rules.pro.
def enableProguardInReleaseBuilds =
    (findProperty("enableProguardInReleaseBuilds") ?: "true").toBoolean()
def targetArchitectures =
    (findProperty("reactNativeArchitectures") ?: "armeabi-v7a,arm64-v8a,x86,x86_64").split(",")

// JSC is intentionally unused — Hermes is enabled in gradle.properties.

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "dev.barrelmaker.obscura"
    defaultConfig {
        applicationId "dev.barrelmaker.obscura"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode obscuraVersionCode
        versionName obscuraVersionName
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        // The libsignal-client JVM artifact bundles native libs for every desktop OS
        // (macOS .dylib, Windows .dll, Linux/server .so) plus a `_testing` JNI variant
        // we never call into. Strip them — they're ~90 MB of dead weight in the APK.
        jniLibs {
            excludes += [
                "**/libsignal_jni_testing.so",
            ]
        }
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "/META-INF/DEPENDENCIES"
            excludes += [
                "**/*.dylib",
                "**/*.dll",
                "**/*.pdb",
                // .so files inside JAR roots (libsignal-client ships server-side natives
                // at the JAR root, not under jni/; the Android JNI libs come from the
                // libsignal-android AAR and aren't matched by this glob).
                "*.so",
            ]
        }
    }
    // Per-ABI APKs cut sideload size ~4x. Keep the universal APK around so
    // existing install scripts and CI continue to work.
    splits {
        abi {
            enable true
            reset()
            include(*targetArchitectures)
            universalApk targetArchitectures.size() > 1
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseSigningConfigured) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signed with the real upload key when keystore.properties is present
            // or the equivalent environment variables are set. Compile-only
            // builds fall back to debug signing; distribution builds fail above.
            signingConfig releaseSigningConfigured ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    }
    // JSC fallback intentionally omitted — Hermes is on (gradle.properties).

    // ObscuraKit — E2E encrypted data layer
    implementation("dev.barrelmaker.obscura.kit:obscura-kit:0.1.0")

    // Android SQLDelight driver (replaces JVM driver from ObscuraKit)
    implementation("app.cash.sqldelight:android-driver:2.0.2")
    implementation("app.cash.sqldelight:coroutines-extensions:2.0.2")

    // libsignal Android native (replaces JVM variant from ObscuraKit)
    implementation("org.signal:libsignal-android:0.72.0")

    // Coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")

    // Lifecycle (foreground reconnect)
    implementation("androidx.lifecycle:lifecycle-process:2.11.0")

    // Firebase Cloud Messaging — silent push wake-up bell. NEVER carries content.
    // Privacy invariant: notification text is hardcoded generic ("New pix" / "New message").
    implementation(platform("com.google.firebase:firebase-bom:34.18.0"))
    implementation("com.google.firebase:firebase-messaging")

    // Desugaring (required by libsignal-android)
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
}
